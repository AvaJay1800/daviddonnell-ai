<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z45C4PE3RB"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner-Friendly CMS Demo | David Donnell</title>
  <meta name="description" content="A live demo of the kind of content manager David Donnell builds for client websites. Edit a fictional lawn company's site and watch it update as you type." />
  <meta name="robots" content="index, follow" />

  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <meta name="theme-color" content="#F4F5F3" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Owner-Friendly CMS Demo | David Donnell" />
  <meta property="og:description" content="Edit a fictional lawn company's website and watch it update as you type. A working demo, not a screenshot." />
  <meta property="og:site_name" content="David Donnell" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Landscaping design system: tokens + core components -->
  <link rel="stylesheet" href="landscape.css" />

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>

  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }

    /* ------------------------------------------------------------ top bar */
    .demo-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 20px;
      background: var(--surface-card);
      border-bottom: 1px solid var(--border-subtle);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: var(--fs-md);
      font-weight: var(--fw-bold);
      color: var(--text-strong);
    }
    .back-link:hover { color: var(--forest-700); }
    .back-link svg { width: 14px; height: 14px; }
    .demo-note {
      font-size: var(--fs-sm);
      font-weight: var(--fw-medium);
      color: var(--text-muted);
      line-height: 1.4;
    }
    .demo-note strong { color: var(--text-body); font-weight: var(--fw-bold); }
    .demo-bar .spacer { flex: 1; }

    /* ------------------------------------------------------------ tabs (mobile) */
    .tabs { display: none; gap: var(--gap-grid); padding: var(--gap-grid) var(--gap-grid) 0; }
    .tab {
      flex: 1;
      font-family: var(--font-sans);
      font-size: var(--fs-md);
      font-weight: var(--fw-bold);
      color: var(--text-muted);
      background: var(--surface-card);
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      padding: 10px;
      cursor: pointer;
    }
    .tab.active {
      color: var(--forest-900);
      background: var(--lime-100);
      border-color: var(--lime-400);
    }
    .tab:focus-visible { outline: none; border-color: var(--focus-ring); box-shadow: 0 0 0 3px var(--lime-100); }

    /* ------------------------------------------------------------ app grid */
    .app {
      flex: 1;
      display: grid;
      grid-template-columns: var(--sidebar-width) 430px 1fr;
      gap: var(--gap-grid);
      padding: var(--gap-grid);
      align-items: start;
      min-height: 0;
    }

    /* ------------------------------------------------------------ sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
      padding: var(--space-5) var(--space-3);
      position: sticky;
      top: var(--gap-grid);
    }
    .wordmark {
      font-size: 17px;
      font-weight: var(--fw-extrabold);
      letter-spacing: var(--tracking-tight);
      color: var(--forest-900);
      line-height: var(--lh-snug);
      padding: 0 var(--space-2);
      overflow-wrap: break-word;
    }
    .wordmark .accent { color: var(--grass-600); }

    .nav { display: flex; flex-direction: column; gap: 4px; }

    .promo {
      margin-top: var(--space-8);
      background: var(--lime-500);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .promo .lc-imageslot { height: 74px; }
    .promo h3 {
      font-size: var(--fs-base);
      font-weight: var(--fw-extrabold);
      color: var(--forest-900);
      line-height: var(--lh-snug);
      margin: 0;
    }
    .promo .lc-btn { background: var(--surface-card); color: var(--forest-900); }
    .promo .lc-btn:hover { background: var(--lime-50); }

    /* ------------------------------------------------------------ editor column */
    .edit-col { display: flex; flex-direction: column; gap: var(--gap-grid); min-width: 0; }

    .sections-card { padding: var(--space-4); }
    .sections-card .lc-card-title { padding: 2px var(--space-2) var(--space-3); font-size: var(--fs-base); }

    .editor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-5);
    }
    .saved-chip {
      font-size: var(--fs-xs);
      font-weight: var(--fw-bold);
      color: var(--text-subtle);
      transition: color var(--dur-base) var(--ease-out);
    }
    .saved-chip.flash { color: var(--grass-600); }

    .field { margin-bottom: var(--space-4); }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }
    .toggle-row .lbl {
      font-size: var(--fs-md);
      font-weight: var(--fw-semibold);
      color: var(--text-body);
      cursor: pointer;
    }

    .ed-item {
      background: var(--surface-sunken);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      margin-bottom: var(--space-2);
    }
    .ed-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-3);
    }
    .ed-item-label {
      font-size: var(--fs-xs);
      font-weight: var(--fw-bold);
      color: var(--text-subtle);
    }
    .ed-item-tools { display: flex; gap: 5px; }
    .ed-item .lc-input, .ed-item .lc-textarea, .ed-item .lc-select { background: var(--surface-card); }

    .btn-add { width: 100%; margin-top: var(--space-2); }

    .hours-row {
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: var(--space-2);
      align-items: center;
      margin-bottom: var(--space-2);
    }
    .hours-row .day {
      font-size: var(--fs-sm);
      font-weight: var(--fw-bold);
      color: var(--text-muted);
      padding-left: var(--space-2);
    }

    /* ------------------------------------------------------------ preview */
    .preview-card {
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      min-width: 0;
    }
    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px var(--space-2) 0;
    }
    .preview-frame {
      background: var(--lime-50);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      overflow: hidden;
    }
    #site {
      background: var(--neutral-0);
      border-radius: var(--radius-sm);
      overflow: hidden;
      max-height: 76vh;
      overflow-y: auto;
    }

    /* ---------------- the fictional website (vibrant green surface) ------ */
    #site .s-banner {
      background: var(--lime-100);
      color: var(--forest-900);
      font-size: var(--fs-sm);
      font-weight: var(--fw-bold);
      text-align: center;
      padding: 9px 16px;
      line-height: 1.4;
    }
    #site .s-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 18px 28px;
    }
    #site .s-name {
      font-size: var(--fs-lg);
      font-weight: var(--fw-extrabold);
      letter-spacing: var(--tracking-tight);
      color: var(--forest-900);
    }
    #site .s-name .accent { color: var(--grass-600); }
    #site .s-phone {
      display: inline-flex;
      align-items: center;
      font-size: var(--fs-sm);
      font-weight: var(--fw-bold);
      color: var(--forest-800);
      background: var(--lime-100);
      border-radius: var(--radius-pill);
      padding: 8px 14px;
    }

    #site .s-hero { text-align: center; padding: 44px 28px 36px; }
    #site .s-eyebrow {
      font-size: var(--fs-2xs);
      font-weight: var(--fw-extrabold);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--grass-600);
      margin-bottom: 12px;
    }
    #site .s-tagline {
      font-family: var(--font-display);
      font-size: clamp(26px, 4vw, var(--fs-d3));
      font-weight: var(--fw-extrabold);
      letter-spacing: var(--tracking-display);
      line-height: var(--lh-tight);
      color: var(--forest-950);
      margin: 0 auto 12px;
      max-width: 420px;
    }
    #site .s-tagline .accent { color: var(--grass-500); }
    #site .s-hero-sub {
      font-size: var(--fs-md);
      font-weight: var(--fw-medium);
      color: var(--text-muted);
      margin: 0 0 20px;
    }
    #site .s-hero .lc-imageslot { height: 120px; margin-top: 28px; border-radius: var(--radius-lg); }

    #site .s-section { padding: 32px 28px; }
    #site .s-section h2 {
      font-size: var(--fs-xl);
      font-weight: var(--fw-extrabold);
      letter-spacing: var(--tracking-tight);
      color: var(--forest-950);
      margin: 0 0 18px;
    }

    #site .s-services { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
    #site .s-service {
      background: var(--neutral-50);
      border-radius: var(--radius-md);
      padding: 16px;
    }
    #site .s-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px; height: 34px;
      border-radius: 50%;
      margin-bottom: 12px;
    }
    #site .s-chip svg { width: 16px; height: 16px; }
    #site .s-service-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }
    #site .s-service-name { font-size: var(--fs-base); font-weight: var(--fw-bold); color: var(--text-strong); }
    #site .s-service-price { font-size: var(--fs-sm); font-weight: var(--fw-extrabold); color: var(--grass-600); white-space: nowrap; }
    #site .s-service-desc { font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--text-muted); line-height: var(--lh-normal); margin: 0; }

    #site .s-hours-band { background: var(--neutral-50); border-radius: var(--radius-lg); margin: 0 28px; padding: 24px; }
    #site .s-hours-band h2 { font-size: var(--fs-lg); margin-bottom: 14px; }
    #site .s-hours-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: var(--fs-md);
      font-weight: var(--fw-medium);
      padding: 6px 0;
    }
    #site .s-hours-row .d { color: var(--text-muted); font-weight: var(--fw-semibold); }
    #site .s-hours-row .t { color: var(--text-strong); font-weight: var(--fw-bold); }

    #site .s-reviews-panel {
      background: var(--forest-800);
      border-radius: var(--radius-xl);
      margin: 32px 28px;
      padding: 28px 24px;
    }
    #site .s-reviews-panel h2 { color: var(--neutral-0); }
    #site .s-reviews { display: grid; gap: 10px; }
    #site .s-review {
      background: var(--forest-700);
      border-radius: var(--radius-md);
      padding: 16px;
    }
    #site .s-stars { color: var(--sun-500); letter-spacing: 2px; font-size: var(--fs-md); margin-bottom: 8px; }
    #site .s-review-text {
      font-size: var(--fs-md);
      font-weight: var(--fw-medium);
      color: var(--lime-50);
      line-height: var(--lh-normal);
      margin: 0 0 10px;
    }
    #site .s-review-name { font-size: var(--fs-xs); font-weight: var(--fw-bold); color: var(--lime-300); }

    #site .s-footer {
      text-align: center;
      font-size: var(--fs-xs);
      font-weight: var(--fw-semibold);
      color: var(--text-subtle);
      padding: 22px 28px 26px;
    }

    /* ------------------------------------------------------------ responsive */
    @media (max-width: 1240px) {
      .app { grid-template-columns: var(--sidebar-width) minmax(340px, 1fr) 1fr; }
    }
    @media (max-width: 1080px) {
      .app { grid-template-columns: 1fr 1fr; }
      .sidebar {
        grid-column: 1 / -1;
        position: static;
        flex-direction: row;
        align-items: center;
        gap: var(--space-4);
        padding: var(--space-3) var(--space-2);
      }
      .sidebar .nav { flex-direction: row; flex-wrap: wrap; }
      .promo { display: none; }
      .wordmark { padding: 0; }
    }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .tabs { display: flex; }
      body.show-preview .edit-col { display: none; }
      body:not(.show-preview) .preview-wrap { display: none; }
      #site { max-height: none; }
      .demo-bar { padding: 10px 14px; }
      .demo-bar .demo-note { display: none; }
    }
  </style>
</head>
<body>

  <header class="demo-bar">
    <a class="back-link" href="/"><i data-lucide="arrow-left"></i>David Donnell</a>
    <span class="lc-badge lc-badge-lime">Live demo</span>
    <span class="demo-note">You're editing the website of <strong>Green Feather Lawn &amp; Garden</strong>, a made-up company. Changes save in your browser only, so go wild.</span>
    <span class="spacer"></span>
    <button class="lc-btn lc-btn-outline lc-btn-sm" id="reset" type="button"><i data-lucide="rotate-ccw"></i>Reset demo</button>
  </header>

  <div class="tabs">
    <button class="tab active" id="tab-edit" type="button">Edit</button>
    <button class="tab" id="tab-preview" type="button">Preview</button>
  </div>

  <main class="app">

    <aside class="sidebar" aria-label="CMS navigation">
      <div class="wordmark" id="wordmark"></div>
      <nav class="nav" aria-label="Demo sections">
        <button class="lc-nav-item" type="button" disabled title="Not part of this demo"><i data-lucide="layout-dashboard"></i>Dashboard</button>
        <button class="lc-nav-item" type="button" disabled title="Not part of this demo"><i data-lucide="inbox"></i>Leads</button>
        <a class="lc-nav-item" href="/demos/quote-builder.html" title="Open the quote builder demo"><i data-lucide="file-text"></i>Quotes</a>
        <button class="lc-nav-item active" type="button"><i data-lucide="globe"></i>Website<i data-lucide="arrow-right" class="arrow"></i></button>
        <button class="lc-nav-item" type="button" disabled title="Not part of this demo"><i data-lucide="settings"></i>Settings</button>
      </nav>
      <div class="promo">
        <div class="lc-imageslot on-lime">your logo here</div>
        <h3>Want a CMS like this for your business?</h3>
        <a class="lc-btn lc-btn-sm" href="https://calendly.com/davidadonnell/30min" target="_blank" rel="noopener noreferrer">Book a free call</a>
      </div>
    </aside>

    <div class="edit-col">
      <div class="lc-card sections-card">
        <h2 class="lc-card-title">Sections</h2>
        <nav class="nav" id="sections" aria-label="Page sections"></nav>
      </div>

      <div class="lc-card" id="editor-card">
        <div class="editor-head">
          <h2 class="lc-card-title" id="editor-title"></h2>
          <span class="saved-chip" id="saved-note">Autosaved</span>
        </div>
        <div id="editor"></div>
      </div>
    </div>

    <section class="preview-wrap" aria-label="Site preview">
      <div class="lc-card preview-card">
        <div class="preview-head">
          <h2 class="lc-card-title">Live preview</h2>
          <span class="lc-badge lc-badge-neutral"><span class="lc-dot lc-dot-completed"></span>Published</span>
        </div>
        <div class="preview-frame">
          <div id="site" aria-live="polite"></div>
        </div>
      </div>
    </section>

  </main>

<script>
(function () {
  var STORE_KEY = 'dd-cms-demo-v2';

  var DEFAULT_CONTENT = {
    name: 'Green Feather Lawn & Garden',
    tagline: 'Your yard, off your plate.',
    phone: '(303) 555-0142',
    banner: { on: true, text: 'Fall cleanup slots are open. Book by October 15.' },
    services: [
      { name: 'Weekly mowing', price: '$45 / visit', desc: 'Mow, edge, and blow. Same crew, same day every week.' },
      { name: 'Sprinkler blowout', price: '$85', desc: 'Lines cleared before the first freeze so nothing cracks.' },
      { name: 'Fall cleanup', price: '$220', desc: 'Leaves hauled, beds cut back, gutters cleared at ground level.' },
      { name: 'Garden bed refresh', price: 'from $150', desc: 'New mulch, edging, and a tidy-up of whatever summer left behind.' }
    ],
    hours: [
      { day: 'Monday', time: '7am - 5pm' },
      { day: 'Tuesday', time: '7am - 5pm' },
      { day: 'Wednesday', time: '7am - 5pm' },
      { day: 'Thursday', time: '7am - 5pm' },
      { day: 'Friday', time: '7am - 5pm' },
      { day: 'Saturday', time: '8am - noon' },
      { day: 'Sunday', time: 'Closed' }
    ],
    reviews: [
      { name: 'Maria T., Wheat Ridge', stars: 5, text: 'They show up when they say they will. That alone puts them ahead of everyone else I tried.' },
      { name: 'Doug H., Arvada', stars: 5, text: 'Sprinkler blowout took fifteen minutes and they checked a leaky valve for free.' },
      { name: 'Priya S., Lakewood', stars: 4, text: 'Yard looks great. Wish they worked Sundays, but that is my only complaint.' }
    ]
  };

  var SECTIONS = [
    { id: 'business', label: 'Business info', icon: 'store' },
    { id: 'banner',   label: 'Banner',        icon: 'megaphone' },
    { id: 'services', label: 'Services',      icon: 'list' },
    { id: 'hours',    label: 'Hours',         icon: 'clock' },
    { id: 'reviews',  label: 'Reviews',       icon: 'star' }
  ];

  var SERVICE_CHIPS = [
    { icon: 'sprout',   bg: 'var(--grass-100)', fg: 'var(--grass-600)' },
    { icon: 'sun',      bg: 'var(--sun-100)',   fg: '#B8860B' },
    { icon: 'hammer',   bg: 'var(--clay-100)',  fg: 'var(--clay-500)' },
    { icon: 'droplets', bg: 'var(--sky-100)',   fg: 'var(--sky-500)' }
  ];

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* private mode or blocked storage: run from memory */ }
    return clone(DEFAULT_CONTENT);
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
    var note = document.getElementById('saved-note');
    note.classList.add('flash');
    note.textContent = 'Saved just now';
    clearTimeout(save._t);
    save._t = setTimeout(function () {
      note.classList.remove('flash');
      note.textContent = 'Autosaved';
    }, 1200);
  }

  var state = load();
  var activeSection = 'business';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function refreshIcons() {
    if (window.lucide) {
      window.lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });
    }
  }

  /* Wordmark: last word of the business name picks up the grass accent */
  function wordmarkHtml(name) {
    var words = String(name).trim().split(/\s+/);
    if (words.length < 2) return '<span class="accent">' + esc(name) + '</span>';
    var last = words.pop();
    return esc(words.join(' ')) + ' <span class="accent">' + esc(last) + '</span>';
  }

  /* ---------------------------------------------------------- site render */
  function renderSite() {
    var s = state;
    var html = '';

    if (s.banner.on && s.banner.text.trim()) {
      html += '<div class="s-banner">' + esc(s.banner.text) + '</div>';
    }

    html += '<header class="s-header">' +
      '<div class="s-name">' + wordmarkHtml(s.name) + '</div>' +
      '<span class="s-phone">' + esc(s.phone) + '</span>' +
      '</header>';

    html += '<div class="s-hero">' +
      '<div class="s-eyebrow">Locally owned &middot; Denver west side</div>' +
      '<h1 class="s-tagline">' + wordmarkHtml(s.tagline) + '</h1>' +
      '<p class="s-hero-sub">Design, mowing and seasonal care for homes across Denver.</p>' +
      '<a class="lc-btn lc-btn-primary">Get a free quote</a>' +
      '<div class="lc-imageslot">hero photo</div>' +
      '</div>';

    if (s.services.length) {
      html += '<div class="s-section"><h2>Services &amp; pricing</h2><div class="s-services">';
      s.services.forEach(function (sv, i) {
        var chip = SERVICE_CHIPS[i % SERVICE_CHIPS.length];
        html += '<div class="s-service">' +
          '<span class="s-chip" style="background:' + chip.bg + '; color:' + chip.fg + '"><i data-lucide="' + chip.icon + '"></i></span>' +
          '<div class="s-service-head">' +
            '<span class="s-service-name">' + esc(sv.name) + '</span>' +
            '<span class="s-service-price">' + esc(sv.price) + '</span>' +
          '</div>' +
          '<p class="s-service-desc">' + esc(sv.desc) + '</p>' +
          '</div>';
      });
      html += '</div></div>';
    }

    html += '<div class="s-hours-band"><h2>Hours</h2>';
    s.hours.forEach(function (h) {
      html += '<div class="s-hours-row"><span class="d">' + esc(h.day) + '</span><span class="t">' + esc(h.time) + '</span></div>';
    });
    html += '</div>';

    if (s.reviews.length) {
      html += '<div class="s-reviews-panel"><div class="s-section" style="padding:0"><h2>What neighbors say</h2><div class="s-reviews">';
      s.reviews.forEach(function (r) {
        var stars = '';
        for (var i = 0; i < 5; i++) stars += i < r.stars ? '★' : '☆';
        html += '<div class="s-review">' +
          '<div class="s-stars">' + stars + '</div>' +
          '<p class="s-review-text">&ldquo;' + esc(r.text) + '&rdquo;</p>' +
          '<div class="s-review-name">' + esc(r.name) + '</div>' +
          '</div>';
      });
      html += '</div></div></div>';
    }

    html += '<footer class="s-footer">&copy; ' + new Date().getFullYear() + ' ' + esc(s.name) + ' &middot; ' + esc(s.phone) + '</footer>';

    document.getElementById('site').innerHTML = html;
    document.getElementById('wordmark').innerHTML = wordmarkHtml(s.name);
    refreshIcons();
  }

  /* -------------------------------------------------------- editor render */
  function field(label, value, key, kind) {
    var tag = kind === 'textarea'
      ? '<textarea class="lc-textarea" data-key="' + key + '">' + esc(value) + '</textarea>'
      : '<input class="lc-input" type="text" data-key="' + key + '" value="' + esc(value) + '" />';
    return '<div class="field"><label class="lc-label">' + label + '</label>' + tag + '</div>';
  }

  function itemTools(list, i, len) {
    return '<div class="ed-item-tools">' +
      '<button class="lc-icon-btn" data-move="up" data-list="' + list + '" data-i="' + i + '" title="Move up" aria-label="Move up"' + (i === 0 ? ' disabled' : '') + '><i data-lucide="arrow-up"></i></button>' +
      '<button class="lc-icon-btn" data-move="down" data-list="' + list + '" data-i="' + i + '" title="Move down" aria-label="Move down"' + (i === len - 1 ? ' disabled' : '') + '><i data-lucide="arrow-down"></i></button>' +
      '<button class="lc-icon-btn lc-danger" data-remove="' + list + '" data-i="' + i + '" title="Remove" aria-label="Remove"><i data-lucide="x"></i></button>' +
      '</div>';
  }

  function renderSections() {
    var html = '';
    SECTIONS.forEach(function (sec) {
      html += '<button class="lc-nav-item' + (sec.id === activeSection ? ' active' : '') + '" type="button" data-section="' + sec.id + '">' +
        '<i data-lucide="' + sec.icon + '"></i>' + sec.label +
        '<i data-lucide="arrow-right" class="arrow"></i></button>';
    });
    document.getElementById('sections').innerHTML = html;
  }

  function renderEditor() {
    var s = state;
    var html = '';
    var section = SECTIONS.filter(function (x) { return x.id === activeSection; })[0];
    document.getElementById('editor-title').textContent = 'Website · ' + section.label;

    if (activeSection === 'business') {
      html += field('Business name', s.name, 'name') +
        field('Tagline', s.tagline, 'tagline') +
        field('Phone', s.phone, 'phone');
    }

    if (activeSection === 'banner') {
      html += '<div class="toggle-row">' +
        '<label class="lc-switch"><input type="checkbox" id="banner-on" data-key="banner.on"' + (s.banner.on ? ' checked' : '') + ' /><span class="track"></span></label>' +
        '<label class="lbl" for="banner-on">Show the banner</label>' +
        '</div>' +
        field('Banner text', s.banner.text, 'banner.text');
    }

    if (activeSection === 'services') {
      s.services.forEach(function (sv, i) {
        html += '<div class="ed-item">' +
          '<div class="ed-item-head"><span class="ed-item-label">Service ' + (i + 1) + '</span>' + itemTools('services', i, s.services.length) + '</div>' +
          field('Name', sv.name, 'services.' + i + '.name') +
          field('Price', sv.price, 'services.' + i + '.price') +
          field('Description', sv.desc, 'services.' + i + '.desc', 'textarea') +
          '</div>';
      });
      html += '<button class="lc-btn lc-btn-outline btn-add" data-add="services" type="button"><i data-lucide="plus"></i>Add a service</button>';
    }

    if (activeSection === 'hours') {
      s.hours.forEach(function (h, i) {
        html += '<div class="hours-row"><span class="day">' + esc(h.day.slice(0, 3)) + '</span>' +
          '<input class="lc-input" type="text" data-key="hours.' + i + '.time" value="' + esc(h.time) + '" aria-label="' + esc(h.day) + ' hours" /></div>';
      });
    }

    if (activeSection === 'reviews') {
      s.reviews.forEach(function (r, i) {
        var opts = '';
        for (var st = 5; st >= 1; st--) {
          opts += '<option value="' + st + '"' + (r.stars === st ? ' selected' : '') + '>' + st + ' star' + (st > 1 ? 's' : '') + '</option>';
        }
        html += '<div class="ed-item">' +
          '<div class="ed-item-head"><span class="ed-item-label">Review ' + (i + 1) + '</span>' + itemTools('reviews', i, s.reviews.length) + '</div>' +
          field('Customer', r.name, 'reviews.' + i + '.name') +
          '<div class="field"><label class="lc-label">Rating</label><select class="lc-select" data-key="reviews.' + i + '.stars">' + opts + '</select></div>' +
          field('Review', r.text, 'reviews.' + i + '.text', 'textarea') +
          '</div>';
      });
      html += '<button class="lc-btn lc-btn-outline btn-add" data-add="reviews" type="button"><i data-lucide="plus"></i>Add a review</button>';
    }

    document.getElementById('editor').innerHTML = html;
    refreshIcons();
  }

  /* ------------------------------------------------------------- updates */
  function setByPath(path, value) {
    var parts = path.split('.');
    var obj = state;
    for (var i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
    obj[parts[parts.length - 1]] = value;
  }

  var editor = document.getElementById('editor');

  editor.addEventListener('input', function (e) {
    var key = e.target.getAttribute('data-key');
    if (!key) return;
    var value;
    if (e.target.type === 'checkbox') value = e.target.checked;
    else if (e.target.tagName === 'SELECT') value = parseInt(e.target.value, 10);
    else value = e.target.value;
    setByPath(key, value);
    renderSite();
    save();
  });

  editor.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;

    var add = btn.getAttribute('data-add');
    if (add === 'services') {
      state.services.push({ name: 'New service', price: '$0', desc: '' });
    } else if (add === 'reviews') {
      state.reviews.push({ name: 'Happy customer', stars: 5, text: '' });
    }

    var rem = btn.getAttribute('data-remove');
    if (rem) state[rem].splice(parseInt(btn.getAttribute('data-i'), 10), 1);

    var move = btn.getAttribute('data-move');
    if (move) {
      var list = state[btn.getAttribute('data-list')];
      var i = parseInt(btn.getAttribute('data-i'), 10);
      var j = move === 'up' ? i - 1 : i + 1;
      if (j >= 0 && j < list.length) {
        var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
      }
    }

    if (add || rem || move) {
      renderEditor();
      renderSite();
      save();
    }
  });

  document.getElementById('sections').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-section]');
    if (!btn) return;
    activeSection = btn.getAttribute('data-section');
    renderSections();
    renderEditor();
    refreshIcons();
  });

  /* Reset — click once to arm, again to confirm */
  var resetBtn = document.getElementById('reset');
  var resetArmed = false;
  var resetTimer;
  resetBtn.addEventListener('click', function () {
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.innerHTML = 'Click again to reset';
      resetTimer = setTimeout(function () {
        resetArmed = false;
        resetBtn.innerHTML = '<i data-lucide="rotate-ccw"></i>Reset demo';
        refreshIcons();
      }, 3000);
      return;
    }
    clearTimeout(resetTimer);
    resetArmed = false;
    resetBtn.innerHTML = '<i data-lucide="rotate-ccw"></i>Reset demo';
    try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
    state = clone(DEFAULT_CONTENT);
    renderSections();
    renderEditor();
    renderSite();
  });

  /* Mobile tabs */
  var tabEdit = document.getElementById('tab-edit');
  var tabPreview = document.getElementById('tab-preview');
  tabEdit.addEventListener('click', function () {
    document.body.classList.remove('show-preview');
    tabEdit.classList.add('active');
    tabPreview.classList.remove('active');
  });
  tabPreview.addEventListener('click', function () {
    document.body.classList.add('show-preview');
    tabPreview.classList.add('active');
    tabEdit.classList.remove('active');
  });

  renderSections();
  renderEditor();
  renderSite();
  window.addEventListener('load', refreshIcons);
})();
</script>
</body>
</html>
