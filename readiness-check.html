<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Z45C4PE3RB"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-Z45C4PE3RB');
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Readiness Check | David Donnell</title>
<meta name="description" content="A free 2-minute AI readiness assessment for small businesses. Answer five quick questions and see where the fastest wins are for your business." />
<meta name="robots" content="index, follow" />

<!-- Favicon + browser chrome -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="theme-color" content="#F2EFE8" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:title" content="AI Readiness Check | David Donnell" />
<meta property="og:description" content="A free 2-minute AI readiness assessment for small businesses. See where the fastest wins are for your business." />
<meta property="og:site_name" content="David Donnell" />

<link rel="preload" href="/assets/fonts/Archivo-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/assets/fonts/IBMPlexMono-400.woff2" as="font" type="font/woff2" crossorigin />

<!-- Design system: drafting paper and physical hardware -->
<link rel="stylesheet" href="/theme.css" />

<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 32px 16px;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .wrap { width: 100%; max-width: 580px; padding: 0; }

  /* The strip above the plate: whose tool this is, and how long it takes. */
  .quiz-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 0 4px 14px;
  }
  .quiz-home {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
    white-space: nowrap;
  }
  .quiz-top .label { text-align: right; }

  .card { padding: 28px; border-radius: 10px; }

  /* Progress runs in a pressed groove. */
  .barwrap {
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 26px;
    background: linear-gradient(var(--deck-bottom), var(--deck-top));
    box-shadow:
      inset 0 1px 3px rgba(22, 22, 26, 0.18),
      0 1px 0 rgba(255, 255, 255, 0.7);
  }
  .bar {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    background: linear-gradient(var(--blueprint-top), var(--blueprint-bottom));
    transition: width 0.45s var(--ease-reveal);
  }

  .qhead { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
  .qhead svg { width: 24px; height: 24px; stroke: var(--pencil); flex-shrink: 0; margin-top: 3px; }
  .qhead .qtext {
    font-weight: 500;
    font-size: 1.375rem;
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: var(--ink);
    text-wrap: balance;
  }
  .step-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--pencil);
    margin-bottom: 10px;
  }

  /* Answers and industries are keys: an edge, and travel when pressed. */
  .opts { display: flex; flex-direction: column; gap: 12px; }
  .pills { display: flex; flex-wrap: wrap; gap: 12px 10px; }
  .opt, .pill {
    border: 0;
    cursor: pointer;
    color: var(--ink);
    background: linear-gradient(var(--key-face-top), var(--key-face-bottom));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.95),
      0 3px 0 var(--key-edge),
      0 6px 12px rgba(22, 22, 26, 0.14);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  .opt:active, .pill:active {
    transform: translateY(3px);
    box-shadow:
      inset 0 2px 5px rgba(22, 22, 26, 0.3),
      0 1px 0 var(--key-edge);
  }
  .opt {
    text-align: left;
    font-family: var(--sans);
    font-size: 0.9375rem;
    line-height: 1.4;
    padding: 14px 16px;
    border-radius: 7px;
  }
  .pill {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 11px;
    line-height: 1;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    height: 36px;
    padding: 0 14px;
    border-radius: 6px;
  }
  .hint { font-size: 0.8125rem; color: var(--pencil); margin-top: 18px; }

  /* Result */
  .center { text-align: center; }
  .score-num {
    font-weight: 500;
    font-size: 76px;
    line-height: 1;
    letter-spacing: -0.04em;
  }
  /* The band reads as a rubber stamp on the sheet. */
  .band {
    display: inline-block;
    margin-top: 14px;
    padding: 7px 14px;
    border: 1px solid;
    border-radius: 4px;
    font-family: var(--mono);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .blurb { font-size: 1rem; line-height: 1.6; margin: 22px 0; color: var(--graphite); }
  .cta-box { padding: 20px; margin-bottom: 18px; }
  .cta-box .lbl {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--pencil);
    margin-bottom: 8px;
  }
  .cta-btn { display: flex; width: 100%; }
  .hidden { display: none; }

  @media (max-width: 480px) {
    .card { padding: 22px 18px; }
    .cta-btn.key-lg { padding: 17px 14px; font-size: 11px; letter-spacing: 0.08em; }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- Screen-reader summary of the page -->
  <h1 class="sr-only">AI Readiness Check &mdash; a free 2-minute assessment for small businesses</h1>

  <div class="quiz-top">
    <a class="quiz-home" href="/">David Donnell</a>
    <span class="label">AI readiness check &middot; About 2 min</span>
  </div>

  <div class="card raised">

    <div class="barwrap"><div class="bar" id="bar"></div></div>

    <!-- INTRO -->
    <div id="intro">
      <div class="qhead">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg>
        <div class="qtext">What kind of business do you run?</div>
      </div>
      <div class="pills" id="industries"></div>
      <div class="hint">Just helps tailor your results. Five quick questions after this.</div>
    </div>

    <!-- QUIZ -->
    <div id="quiz" class="hidden" aria-live="polite"></div>

    <!-- RESULT -->
    <div id="result" class="hidden" aria-live="polite"></div>

  </div>
</div>

<script>
/* ============================================================
   1) CALENDAR LINK — change this one line to update the CTA button.
   ============================================================ */
const CALENDAR_URL = "https://calendly.com/davidadonnell/30min";

const INDUSTRIES = ["Trades & home services","Retail & e-commerce","Food & hospitality","Professional services","Health & wellness","Creative & events","Something else"];

const Q = [
  { q: "How do new customers usually find or reach you?",
    icon: '<path d="M3 7l9 6 9-6"/><rect x="3" y="5" width="18" height="14" rx="2"/>',
    a: [["Mostly word of mouth and walk-ins",1],["A mix of referrals, social, and online",2],["A website or inbox that funnels inquiries",3]] },
  { q: "How long before a new inquiry hears back from you?",
    icon: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    a: [["Same day when I get a moment",1],["Usually within a day or two",2],["Often longer, things slip",0]] },
  { q: "How much weekly time goes to repetitive admin?",
    icon: '<path d="M4 4h16v4H4z"/><path d="M4 12h16v8H4z"/>',
    a: [["Under 3 hours",3],["3 to 8 hours",2],["More than 8 hours",1]] },
  { q: "How do you keep track of customers and their history?",
    icon: '<path d="M16 21v-2a4 4 0 0 0-8 0v2"/><circle cx="12" cy="7" r="4"/>',
    a: [["In my head, notes, or messages",1],["Spreadsheets",2],["A CRM or dedicated app",3]] },
  { q: "What would move the needle most right now?",
    icon: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
    a: [["More customers coming in",2],["Less time on busywork",2],["Faster, more professional follow-up",2]] },
];

let step = 0, score = 0, max = 0, industry = "";
Q.forEach(it => max += Math.max(...it.a.map(x => x[1])));

const bar = document.getElementById('bar');
const intro = document.getElementById('intro');
const quiz = document.getElementById('quiz');

const indWrap = document.getElementById('industries');
INDUSTRIES.forEach(label => {
  const b = document.createElement('button');
  b.className = 'pill'; b.textContent = label;
  b.onclick = () => {
    industry = label;
    if (typeof gtag === 'function') gtag('event', 'quiz_start', { industry: label });
    intro.classList.add('hidden'); quiz.classList.remove('hidden'); render();
  };
  indWrap.appendChild(b);
});

function icon(paths) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
}

function render() {
  const it = Q[step];
  bar.style.width = (step / Q.length * 100) + '%';
  quiz.innerHTML =
    '<div class="step-label">Question ' + (step + 1) + ' of ' + Q.length + '</div>' +
    '<div class="qhead">' + icon(it.icon) + '<div class="qtext">' + it.q + '</div></div>' +
    '<div class="opts" id="opts"></div>';
  const opts = document.getElementById('opts');
  it.a.forEach(([label, val]) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = label;
    b.onclick = () => { score += val; step++; (step < Q.length) ? render() : showResult(); };
    opts.appendChild(b);
  });
}

function showResult() {
  bar.style.width = '100%';
  quiz.classList.add('hidden');
  const pct = Math.round(score / max * 100);
  let band, color, blurb;
  if (pct >= 70) {
    band = 'Ready to scale'; color = '#1e8a5a';
    blurb = "You've got solid habits in place. The biggest wins now come from automating follow-up and freeing your time, exactly what a focused plan can unlock.";
  } else if (pct >= 40) {
    band = 'Some quick wins waiting'; color = '#c6551f';
    blurb = "You're doing a lot right, but a few leaks like slow follow-up or scattered tracking are likely costing you business. These are usually fast and inexpensive to fix.";
  } else {
    band = 'Big opportunity'; color = '#2946e8';
    blurb = "There's real money being left on the table in how inquiries and admin are handled. The good news: the easiest, highest-impact improvements are still ahead of you.";
  }

  const bandSlug = band.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  if (typeof gtag === 'function') gtag('event', 'quiz_complete', { score: pct, band: bandSlug, industry: industry });
  const ctaUrl = CALENDAR_URL + '?utm_source=site&utm_campaign=quiz&utm_content=' + encodeURIComponent(bandSlug + '-' + pct);

  const r = document.getElementById('result');
  r.classList.remove('hidden');
  r.innerHTML =
    '<div class="center">' +
      '<div class="step-label">Your readiness score' + (industry ? ' &middot; ' + industry : '') + '</div>' +
      '<div class="score-num" style="color:' + color + '">' + pct + '<span style="font-size:24px">/100</span></div>' +
      '<div class="band" style="color:' + color + '; border-color:' + color + '">' + band + '</div>' +
    '</div>' +
    '<p class="blurb">' + blurb + '</p>' +
    '<div class="cta-box well">' +
      '<div class="lbl">Want the full picture?</div>' +
      '<div style="font-size:15px; margin-bottom:16px;">Book a free 30-minute discovery call and we\'ll walk through where the fastest wins are for your business.</div>' +
      '<a class="cta-btn key key-lg key-primary" href="' + ctaUrl + '" target="_blank" rel="noopener">Book my free discovery call</a>' +
    '</div>' +
    '<div class="center"><button class="retake key key-sm" onclick="location.reload()">Retake</button></div>';

  r.querySelector('.cta-btn').addEventListener('click', function () {
    if (typeof gtag === 'function') gtag('event', 'quiz_cta', { score: pct, band: bandSlug, industry: industry });
  });
}
</script>
</body>
</html>
