<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Readiness Check | David Donnell</title>
<meta name="description" content="A free 2-minute AI readiness assessment for small businesses. Answer five quick questions and see where the fastest wins are for your business." />
<meta name="robots" content="index, follow" />

<!-- Favicon + browser chrome -->
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<meta name="theme-color" content="#0d0e1a" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:title" content="AI Readiness Check | David Donnell" />
<meta property="og:description" content="A free 2-minute AI readiness assessment for small businesses. See where the fastest wins are for your business." />
<meta property="og:site_name" content="David Donnell" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
  :root {
    --navy:    #0D0E1A;
    --navy-2:  #16172a;
    --card:    #1b1c30;
    --teal:    #00D4AA;
    --teal-dk: #04342C;
    --text:    #EDEDF2;
    --muted:   #9B9CB0;
    --line:    rgba(255,255,255,0.10);
    --amber:   #EF9F27;
    --coral:   #E0724A;
    --radius:  14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--navy);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 32px 16px;
    min-height: 100vh;
  }

  /* Screen-reader-only heading / labels */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .wrap { width: 100%; max-width: 580px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 9px;
    font-size: 12.5px; letter-spacing: 0.04em; color: var(--muted);
    text-transform: uppercase; margin-bottom: 16px;
  }
  .eyebrow svg { width: 18px; height: 18px; stroke: var(--muted); }
  .barwrap { height: 6px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; margin-bottom: 24px; }
  .bar { height: 100%; width: 0%; background: var(--teal); border-radius: 999px; transition: width .35s ease; }
  .qhead { display: flex; align-items: flex-start; gap: 11px; margin-bottom: 18px; }
  .qhead svg { width: 24px; height: 24px; stroke: var(--teal); flex-shrink: 0; margin-top: 2px; }
  .qhead .qtext { font-size: 18px; font-weight: 600; line-height: 1.35; }
  .step-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt, .pill {
    text-align: left; font: inherit; color: var(--text);
    background: var(--navy-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 13px 15px; cursor: pointer;
    transition: border-color .15s, background .15s; line-height: 1.4;
  }
  .opt:hover, .pill:hover { border-color: var(--teal); }
  .opt.sel, .pill.sel { border-color: var(--teal); background: rgba(0,212,170,0.10); }
  /* Visible keyboard focus ring (accessible on the dark background) */
  .opt:focus-visible, .pill:focus-visible, .cta-btn:focus-visible, .retake:focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 2px;
  }
  .pills { display: flex; flex-wrap: wrap; gap: 9px; }
  .pill { border-radius: 999px; padding: 9px 15px; font-size: 14.5px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 14px; }
  /* result */
  .score-num { font-size: 52px; font-weight: 700; line-height: 1; }
  .band {
    display: inline-block; margin-top: 12px; font-size: 14px; font-weight: 600;
    padding: 6px 16px; border-radius: 999px; border: 1px solid;
  }
  .center { text-align: center; }
  .blurb { font-size: 15.5px; line-height: 1.6; margin: 20px 0; }
  .cta-box {
    background: var(--navy-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px; margin-bottom: 16px;
  }
  .cta-box .lbl { font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .cta-btn {
    display: block; width: 100%; text-align: center; text-decoration: none;
    font-size: 15.5px; font-weight: 700; color: var(--teal-dk);
    background: var(--teal); border: none; border-radius: 10px;
    padding: 14px; cursor: pointer; transition: filter .15s;
  }
  .cta-btn:hover { filter: brightness(1.08); }
  .retake { background: none; border: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; margin-top: 16px; }
  .retake:hover { color: var(--text); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <!-- Screen-reader summary of the page -->
  <h1 class="sr-only">AI Readiness Check &mdash; a free 2-minute assessment for small businesses</h1>

  <div class="card">

    <div class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14l4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
      <span>AI readiness check &middot; ~2 min</span>
    </div>

    <div class="barwrap"><div class="bar" id="bar"></div></div>

    <!-- INTRO -->
    <div id="intro">
      <div class="qhead">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg>
        <div class="qtext">What kind of business do you run?</div>
      </div>
      <div class="pills" id="industries"></div>
      <div class="hint">Just helps tailor your results. Five quick questions after this.</div>
    </div>

    <!-- QUIZ -->
    <div id="quiz" class="hidden" aria-live="polite"></div>

    <!-- RESULT -->
    <div id="result" class="hidden" aria-live="polite"></div>

  </div>
</div>

<script>
/* ============================================================
   1) CALENDAR LINK — change this one line to update the CTA button.
   ============================================================ */
const CALENDAR_URL = "https://calendly.com/davidadonnell/30min";

const INDUSTRIES = ["Trades & home services","Retail & e-commerce","Food & hospitality","Professional services","Health & wellness","Creative & events","Something else"];

const Q = [
  { q: "How do new customers usually find or reach you?",
    icon: '<path d="M3 7l9 6 9-6"/><rect x="3" y="5" width="18" height="14" rx="2"/>',
    a: [["Mostly word of mouth and walk-ins",1],["A mix of referrals, social, and online",2],["A website or inbox that funnels inquiries",3]] },
  { q: "How long before a new inquiry hears back from you?",
    icon: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    a: [["Same day when I get a moment",1],["Usually within a day or two",2],["Often longer, things slip",0]] },
  { q: "How much weekly time goes to repetitive admin?",
    icon: '<path d="M4 4h16v4H4z"/><path d="M4 12h16v8H4z"/>',
    a: [["Under 3 hours",3],["3 to 8 hours",2],["More than 8 hours",1]] },
  { q: "How do you keep track of customers and their history?",
    icon: '<path d="M16 21v-2a4 4 0 0 0-8 0v2"/><circle cx="12" cy="7" r="4"/>',
    a: [["In my head, notes, or messages",1],["Spreadsheets",2],["A CRM or dedicated app",3]] },
  { q: "What would move the needle most right now?",
    icon: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
    a: [["More customers coming in",2],["Less time on busywork",2],["Faster, more professional follow-up",2]] },
];

let step = 0, score = 0, max = 0, industry = "";
Q.forEach(it => max += Math.max(...it.a.map(x => x[1])));

const bar = document.getElementById('bar');
const intro = document.getElementById('intro');
const quiz = document.getElementById('quiz');

const indWrap = document.getElementById('industries');
INDUSTRIES.forEach(label => {
  const b = document.createElement('button');
  b.className = 'pill'; b.textContent = label;
  b.onclick = () => { industry = label; intro.classList.add('hidden'); quiz.classList.remove('hidden'); render(); };
  indWrap.appendChild(b);
});

function icon(paths) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
}

function render() {
  const it = Q[step];
  bar.style.width = (step / Q.length * 100) + '%';
  quiz.innerHTML =
    '<div class="step-label">Question ' + (step + 1) + ' of ' + Q.length + '</div>' +
    '<div class="qhead">' + icon(it.icon) + '<div class="qtext">' + it.q + '</div></div>' +
    '<div class="opts" id="opts"></div>';
  const opts = document.getElementById('opts');
  it.a.forEach(([label, val]) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = label;
    b.onclick = () => { score += val; step++; (step < Q.length) ? render() : showResult(); };
    opts.appendChild(b);
  });
}

function showResult() {
  bar.style.width = '100%';
  quiz.classList.add('hidden');
  const pct = Math.round(score / max * 100);
  let band, color, blurb;
  if (pct >= 70) {
    band = 'Ready to scale'; color = '#00D4AA';
    blurb = "You've got solid habits in place. The biggest wins now come from automating follow-up and freeing your time, exactly what a focused plan can unlock.";
  } else if (pct >= 40) {
    band = 'Some quick wins waiting'; color = '#EF9F27';
    blurb = "You're doing a lot right, but a few leaks like slow follow-up or scattered tracking are likely costing you business. These are usually fast and inexpensive to fix.";
  } else {
    band = 'Big opportunity'; color = '#E0724A';
    blurb = "There's real money being left on the table in how inquiries and admin are handled. The good news: the easiest, highest-impact improvements are still ahead of you.";
  }

  const r = document.getElementById('result');
  r.classList.remove('hidden');
  r.innerHTML =
    '<div class="center">' +
      '<div class="step-label">Your readiness score' + (industry ? ' &middot; ' + industry : '') + '</div>' +
      '<div class="score-num" style="color:' + color + '">' + pct + '<span style="font-size:24px">/100</span></div>' +
      '<div class="band" style="color:' + color + '; border-color:' + color + '">' + band + '</div>' +
    '</div>' +
    '<p class="blurb">' + blurb + '</p>' +
    '<div class="cta-box">' +
      '<div class="lbl">Want the full picture?</div>' +
      '<div style="font-size:15px; margin-bottom:14px;">Book a free 30-minute discovery call and we\'ll walk through where the fastest wins are for your business.</div>' +
      '<a class="cta-btn" href="' + CALENDAR_URL + '" target="_blank" rel="noopener">Book my free discovery call &rarr;</a>' +
    '</div>' +
    '<div class="center"><button class="retake" onclick="location.reload()">&#8635; Retake</button></div>';
}
</script>
</body>
</html>
